name: Publish to npm
on:
  release:
    types:
      - created
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Build
        run: bun run build
      - name: Compile platform binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          # Native Linux (runner)
          bun run compile
          cp dist/youtube-music-cli dist/youtube-music-cli-linux-x64
          # Cross-compile Windows + macOS
          bun build source/cli.tsx --compile --target=bun-windows-x64 --outfile dist/youtube-music-cli-windows-x64.exe
          bun build source/cli.tsx --compile --target=bun-darwin-x64 --outfile dist/youtube-music-cli-darwin-x64
          bun build source/cli.tsx --compile --target=bun-darwin-arm64 --outfile dist/youtube-music-cli-darwin-arm64
          # Legacy names for older install scripts / docs
          cp dist/youtube-music-cli-windows-x64.exe dist/youtube-music-cli.exe
      - name: Prepare release notes
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          NOTES="docs/releases/v${TAG}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" latest-release.md
            echo "Using milestone notes: $NOTES"
          else
            awk '/^#+ \[?[0-9]/ { if (p) exit; p=1 } p' CHANGELOG.md > latest-release.md
            echo "Using CHANGELOG slice"
          fi
      - uses: JS-DevTools/npm-publish@v4
        with:
          token: ${{ secrets.NPM_TOKEN }}

      - name: Release to GitHub
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/youtube-music-cli
            dist/youtube-music-cli-linux-x64
            dist/youtube-music-cli.exe
            dist/youtube-music-cli-windows-x64.exe
            dist/youtube-music-cli-darwin-x64
            dist/youtube-music-cli-darwin-arm64
          body_path: latest-release.md
